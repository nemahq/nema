name: Neo4j Keep-Alive

on:
  schedule:
    - cron: "0 9 */2 * *" # Every 2 days at 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Query Neo4j
        run: |
          pip install -q neo4j
          python -c "
          from neo4j import GraphDatabase
          import os
          d = GraphDatabase.driver(os.environ['NEO4J_URI'], auth=(os.environ['NEO4J_USERNAME'], os.environ['NEO4J_PASSWORD']))
          with d.session(database=os.environ.get('NEO4J_DATABASE', 'neo4j')) as s:
              r = s.run('MATCH (n) RETURN count(n) AS cnt').single()
              print(f'Neo4j alive: {r[\"cnt\"]} nodes')
          d.close()
          "
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
