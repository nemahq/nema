name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Check for migration changes
        if: github.event_name == 'pull_request'
        id: migrations
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1

      - name: Verify database types are up to date
        if: steps.migrations.outputs.changed == 'true'
        run: |
          supabase start
          supabase gen types --lang=typescript --local > /tmp/database.types.ts
          supabase stop
          if ! diff -q /tmp/database.types.ts apps/server/src/infra/database.types.ts > /dev/null 2>&1; then
            echo "::error::database.types.ts is out of date. Run 'supabase gen types --lang=typescript --local > apps/server/src/infra/database.types.ts' locally and commit."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Knip (unused code)
        run: pnpm knip

      - name: Dependency cruiser (circular deps)
        run: pnpm depcruise

      - name: Test
        run: pnpm test

  tolgee-push:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: tolgee-push
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Push translations to Tolgee
        run: pnpm tolgee:push
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
          TOLGEE_API_URL: ${{ secrets.TOLGEE_API_URL }}
