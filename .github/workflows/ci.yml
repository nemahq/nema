name: CI

on:
  push:
    branches: [main, staging]
    tags: ["v*"]
  pull_request:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Check for migration changes
        if: github.event_name == 'pull_request'
        id: migrations
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Verify database types are up to date
        if: steps.migrations.outputs.changed == 'true'
        run: |
          supabase start
          supabase gen types --lang=typescript --local > /tmp/database.types.ts
          supabase stop
          if ! diff -q /tmp/database.types.ts apps/server/src/infra/database.types.ts > /dev/null 2>&1; then
            echo "::error::database.types.ts is out of date. Run 'supabase gen types --lang=typescript --local > apps/server/src/infra/database.types.ts' locally and commit."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Knip (unused code)
        run: pnpm knip

      - name: Dependency cruiser (circular deps)
        run: pnpm depcruise

      - name: Test
        run: pnpm test

  deploy-staging:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check for migration changes
        id: migrations
        run: |
          if git diff --name-only HEAD~1 -- 'supabase/migrations/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Push migrations to staging
        if: steps.migrations.outputs.changed == 'true'
        run: |
          set -euo pipefail
          supabase link --project-ref iydatypmzqconlcqljbj
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}

      - name: Deploy server to staging
        run: railway up --service server --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy web to staging
        run: railway up --service web --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-production:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check for migration changes
        id: migrations
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only "$PREV_TAG"...HEAD -- 'supabase/migrations/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Push migrations to production
        if: steps.migrations.outputs.changed == 'true'
        run: |
          set -euo pipefail
          supabase link --project-ref rvsecpihaiibosuchmdw
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy server to production
        run: railway up --service server --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy web to production
        run: railway up --service web --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  tolgee-push:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: tolgee-push
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Push translations to Tolgee
        run: pnpm tolgee:push
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
          TOLGEE_API_URL: ${{ secrets.TOLGEE_API_URL }}
