name: CI

on:
  push:
    branches: [main, staging]
    tags: ["v*"]
  pull_request:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    # PR은 ref(=PR 번호) 기준으로 묶어 같은 PR에 커밋을 연달아 push하면 이전 run을 취소한다.
    # push(브랜치/태그)는 sha 기준으로 묶는다 — ref로 묶으면 GitHub Actions가
    # cancel-in-progress 설정과 무관하게 "대기 중인 이전 run"은 무조건 취소해버려서,
    # staging/main에 커밋이 연달아 push될 때 중간 커밋의 check(및 그 뒤 migration
    # push·배포·번역 동기화 등 후속 job)가 통째로 스킵될 수 있다.
    concurrency:
      group: ci-check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # 팀 슬러그는 민감 정보가 아니므로(Vercel URL에 그대로 노출) secret이 아닌 variable로 등록한다.
      # Turborepo remote cache는 Railway 배포와 무관한 별도 서비스 — 캐시 저장 용도로만 쓴다.
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 마이그레이션 변경 감지가 base 브랜치와 diff하므로 전체 이력 필요
          # (기본 fetch-depth: 1에서는 base ref가 없어 감지가 조용히 skip되던 버그)
          fetch-depth: 0

      - name: Determine diff base
        # PR은 base 브랜치, 브랜치 push는 직전 커밋, 태그 push는 직전 태그와 비교한다
        # (deploy-staging/deploy-production이 각자 쓰는 diff 기준과 동일하게 맞춘다).
        id: diffbase
        env:
          # ${{ }}를 셸 스크립트 본문에 직접 펼치지 않고 env로 받는다 — 브랜치·태그 이름이
          # 스크립트로 해석될 여지를 없애기 위한 GitHub 권장 방식이다.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/tags/* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            echo "base=$PREV_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate migration timestamp order
        # 마이그레이션 파일명(타임스탬프)이 실제 적용 순서를 결정하는데, 병렬 브랜치는 그
        # 타임스탬프를 서로의 존재를 모른 채 생성한다 — 먼저 머지된 브랜치가 staging에 더
        # 늦은 타임스탬프를 남기면 나중 브랜치의 파일이 그보다 이른 타임스탬프로 도착해
        # `supabase db push`가 배포 시점에야 순서 위반으로 거부한다(#493·#495 staging 배포
        # 실패로 실제 발생, 2026-07-26). PR 단계에서 미리 잡아 rebase를 강제한다. 저렴한
        # 순수 git 검사라 무거운 빌드·테스트보다 앞에 둔다.
        #
        # PR에서만 실패(exit 1)시키고 push에서는 경고만 남긴다 — push(머지 후)에서까지
        # 막으면 이 검사가 파일명만 보므로 원격 DB를 아무리 고쳐도 같은 커밋에서 영원히
        # 빨간불이라 빈 커밋을 새로 밀어야 벗어나고, needs: check인 배포 job까지 막힌다.
        # 또한 BASE는 이 실행 시점 스냅샷이라 이 PR 통과 뒤 다른 PR이 더 늦은 타임스탬프로
        # 먼저 머지되면(정확히 #493/#495의 레이스) 그린 상태가 이미 낡은 것이다 — 이걸
        # 막는 정석인 "Require branches up to date" 브랜치 보호는 Private+Free 플랜에서
        # API 자체가 403이라 못 켠다. push에서도 계속 돌려 그 레이스가 나면 사후에라도
        # 보이게 한다.
        if: steps.diffbase.outputs.base != ''
        env:
          BASE: ${{ steps.diffbase.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
          # supabase migration new가 붙이는 형식(YYYYMMDDHHMMSS_이름.sql) — 이 형식이
          # 아닌 파일은 문자열 비교 자체가 무의미해진다("README.md" > "20260726093453"가
          # 참으로 나와 최댓값을 오염시키거나 순서 위반을 놓친다).
          TS_FORMAT: '^[0-9]{14}_.+\.sql$'
        run: |
          set -euo pipefail

          FAILED=false
          report() {
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::error file=$1::$2"
              FAILED=true
            else
              echo "::warning file=$1::$2"
            fi
          }

          # --diff-filter=A만 쓰면 리네임(R)으로 타임스탬프를 바꾼 기존 파일이 검사를
          # 통째로 빠져나간다 — 이 레포가 실제로 그 방식으로 순서를 고친 전례가 있다
          # (#473). AR 둘 다 잡고, R은 새 경로(마지막 필드)만 본다.
          NEW_MIGRATIONS=$(
            git diff --name-status --diff-filter=AR "$BASE"...HEAD -- 'supabase/migrations/' \
              | awk '{print $NF}' | sort
          )
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "::notice::no new migrations in this diff — skipping"
            exit 0
          fi

          WELL_FORMED=$(printf '%s\n' "$NEW_MIGRATIONS" | sed 's#.*/##' | grep -E "$TS_FORMAT" || true)
          MALFORMED=$(printf '%s\n' "$NEW_MIGRATIONS" | sed 's#.*/##' | grep -vE "$TS_FORMAT" || true)

          if [ -n "$MALFORMED" ]; then
            while IFS= read -r name; do
              report "supabase/migrations/$name" "migration filename doesn't match '<14-digit timestamp>_<name>.sql' — recreate it via 'supabase migration new <name>'."
            done <<< "$MALFORMED"
          fi

          if [ -n "$WELL_FORMED" ]; then
            # 같은 배치 안에서 타임스탬프가 겹치면 supabase가 migration version(파일명
            # 앞 14자리)으로 추적하므로 서로 다른 파일이라도 같은 version으로 충돌한다.
            DUP=$(printf '%s\n' "$WELL_FORMED" | cut -c1-14 | sort | uniq -d)
            if [ -n "$DUP" ]; then
              report "supabase/migrations" "duplicate migration timestamp(s) in this diff: $DUP — each new migration needs a distinct 14-digit prefix."
            fi
          fi

          # $BASE 시점에 이미 있던, 형식을 지킨 마이그레이션 중 가장 늦은 것.
          # xargs -n1 basename은 안 쓴다 — 빈 입력에 GNU xargs(러너)는 basename을 인자
          # 없이 한 번 실행해 rc 123으로 pipefail을 터뜨린다(macOS BSD xargs는 조용히
          # 넘어가 로컬 테스트로는 이 차이가 안 보인다). 경로가 전부 같은 디렉터리라
          # sed로 충분하다.
          EXISTING_MAX=$(
            git ls-tree -r --name-only "$BASE" -- 'supabase/migrations/' \
              | sed 's#.*/##' | { grep -E "$TS_FORMAT" || true; } | sort | tail -1
          )
          if [ -z "$EXISTING_MAX" ]; then
            echo "::notice::no existing migrations on base '$BASE' to compare against"
          elif [ -n "$WELL_FORMED" ]; then
            EXISTING_MAX_TS=${EXISTING_MAX:0:14}
            while IFS= read -r name; do
              TS=${name:0:14}
              if [[ ! "$TS" > "$EXISTING_MAX_TS" ]]; then
                report "supabase/migrations/$name" "timestamp ($TS) does not sort after the latest migration on base '$BASE' ($EXISTING_MAX). Another branch already merged a later one — rebase onto the latest base and recreate this file via 'supabase migration new <name>' so its timestamp sorts after $EXISTING_MAX_TS."
              fi
            done <<< "$WELL_FORMED"
          fi

          if [ "$FAILED" = true ]; then
            exit 1
          fi
          echo "::notice::migration timestamp checks passed"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # 실패 빈도가 높고 저렴한 정적 검사부터: Build/Test 같은 무거운 단계를
      # 기다리지 않고 포맷·린트·타입 오류를 가장 먼저 잡는다.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Knip (unused code)
        run: pnpm knip

      - name: Dependency cruiser (circular deps)
        run: pnpm depcruise

      - name: Build
        run: pnpm build

      - name: Check for migration/server changes
        # 통합 테스트(apps/server/src/services/*.integration.test.ts)가 검증하는 대상은
        # migration 파일뿐 아니라 서버 로직·apps/server가 의존하는 packages/shared/src도
        # 포함한다. DB 없이 돌면 테스트가 조용히 스킵되며 통과 처리되므로, 이 셋 중
        # 하나라도 바뀌면 DB를 띄운다. migrations_changed는 db_needed와 같은 diff
        # 결과에서 걸러내 — 두 출력이 서로 다른 git diff를 호출해 어긋나는 일이 없게 한다.
        id: changes
        env:
          BASE: ${{ steps.diffbase.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            # 이전 태그가 없는 첫 배포 등 비교 기준이 없는 경우 안전하게 "변경됨"으로 취급
            echo "db_needed=true" >> "$GITHUB_OUTPUT"
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
          else
            ALL_CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'apps/server/' 'packages/shared/src/' 'supabase/migrations/')
            if [ -n "$ALL_CHANGED" ]; then
              echo "db_needed=true" >> "$GITHUB_OUTPUT"
            fi
            if echo "$ALL_CHANGED" | grep -q '^supabase/migrations/'; then
              echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Supabase CLI
        if: steps.changes.outputs.db_needed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0-beta.10

      - name: Start Supabase
        # 여기서 띄운 인스턴스를 아래 Verify/Test 스텝이 그대로 재사용한다 —
        # 정리는 job 마지막의 Stop Supabase에서 한 번만 한다.
        if: steps.changes.outputs.db_needed == 'true'
        run: supabase start

      - name: Verify database types are up to date
        if: steps.changes.outputs.migrations_changed == 'true'
        run: |
          set -euo pipefail
          supabase gen types --lang=typescript --local > apps/server/src/infra/database.types.ts
          # CLI가 exit 0으로 빈 출력을 내면 아래 diff가 "재생성하라"는 엉뚱한 안내로 실패하므로 원인을 먼저 가린다
          [ -s apps/server/src/infra/database.types.ts ] || { echo "::error::supabase gen types produced empty output"; exit 1; }
          # 커밋본은 pre-commit prettier가 재포맷하므로 raw 생성물도 같은 포맷으로 맞춰 비교
          pnpm exec prettier --write apps/server/src/infra/database.types.ts
          if ! git diff --exit-code apps/server/src/infra/database.types.ts; then
            echo "::error::database.types.ts is out of date. Run 'pnpm supabase:gen-types' locally and commit."
            exit 1
          fi

      - name: Test
        run: pnpm test
        env:
          # db_needed인데 실제로 DB 연결이 안 되면(Start Supabase 실패 등) 통합 테스트가
          # 조용히 통과하지 않고 시끄럽게 실패하도록 한다 — 경로 필터가 놓친 케이스까지
          # 커버하진 못하지만, 여기서 표시한 대로 DB가 있어야 하는 상황에서의 안전망이다.
          REQUIRE_LOCAL_DB: ${{ steps.changes.outputs.db_needed }}

      - name: Stop Supabase
        if: always() && steps.changes.outputs.db_needed == 'true'
        run: supabase stop || true

  # Railway staging auto-deploy must be OFF — this job manages deployment sequencing.
  deploy-staging:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check for migration changes
        id: migrations
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD~1 -- 'supabase/migrations/')
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0-beta.10

      - name: Push migrations to staging
        if: steps.migrations.outputs.changed == 'true'
        run: |
          set -euo pipefail
          supabase link --project-ref iydatypmzqconlcqljbj
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}

      # railway up은 git 메타데이터 없이 파일만 올린다 — 빌드가 읽을 커밋 SHA를 파일로 스탬프.
      # .commit-sha를 gitignore에 넣지 말 것 — railway up이 gitignore된 파일을 업로드에서 제외해 전 배포가 dev로 회귀한다.
      - name: Stamp commit SHA
        run: echo "$GITHUB_SHA" > .commit-sha

      - name: Deploy server to staging
        run: railway up --service server --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Deploy web to staging
        run: railway up --service web --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Deploy mcp to staging
        run: railway up --service mcp --environment staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

  deploy-production:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check for migration changes
        id: migrations
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only "$PREV_TAG"...HEAD -- 'supabase/migrations/')
            if [ -n "$CHANGED" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0-beta.10

      - name: Push migrations to production
        if: steps.migrations.outputs.changed == 'true'
        run: |
          set -euo pipefail
          supabase link --project-ref rvsecpihaiibosuchmdw
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # railway up은 git 메타데이터 없이 파일만 올린다 — 빌드가 읽을 커밋 SHA를 파일로 스탬프.
      # .commit-sha를 gitignore에 넣지 말 것 — railway up이 gitignore된 파일을 업로드에서 제외해 전 배포가 dev로 회귀한다.
      - name: Stamp commit SHA
        run: echo "$GITHUB_SHA" > .commit-sha

      - name: Deploy server to production
        run: railway up --service server --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy web to production
        run: railway up --service web --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy mcp to production
        run: railway up --service mcp --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  tolgee-push:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: tolgee-push
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Push translations to Tolgee
        run: pnpm tolgee:push
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
          TOLGEE_API_URL: ${{ secrets.TOLGEE_API_URL }}
