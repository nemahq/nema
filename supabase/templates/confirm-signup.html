<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #fafaf9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            width="400"
            cellpadding="0"
            cellspacing="0"
            style="background-color: #ffffff; border-radius: 12px; padding: 40px"
          >
            <tr>
              <td align="center" style="padding-bottom: 32px">
                <img
                  src="https://getnema.app/icon-192.png"
                  alt="Nema"
                  width="48"
                  height="48"
                  style="border-radius: 12px"
                />
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  font-size: 20px;
                  font-weight: 600;
                  color: #1c1917;
                  padding-bottom: 8px;
                "
              >
                Confirm your email
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  font-size: 14px;
                  color: #78716c;
                  padding-bottom: 32px;
                  line-height: 1.5;
                "
              >
                Click the button below to confirm your email address.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 32px">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background-color: #0d9488;
                    color: #ffffff;
                    font-size: 14px;
                    font-weight: 600;
                    text-decoration: none;
                    padding: 12px 32px;
                    border-radius: 8px;
                  "
                >
                  Confirm email
                </a>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="font-size: 12px; color: #a8a29e; line-height: 1.5"
              >
                If you didn't request this, please ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
